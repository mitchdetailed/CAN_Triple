; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:CAN_Triple]
platform = ststm32
platform_packages = framework-stm32cubeg4 @ 1.6.1
board = CAN_Triple
framework = stm32cube
build_flags =  -Wl,-u,_printf_float, -Wl,-u,_scanf_float
upload_protocol = stlink
debug_tool = stlink
debug_speed = 24000
; STLINK-V3MINI upload/debug settings live in boards/CAN_Triple.json so that both
; `pio run -t upload` and `pio debug` use the same OpenOCD invocation on every
; machine, whichever OpenOCD version PlatformIO installed there.
; See "Programming Tools/README.md" - do not add a debug_server override here.

monitor_speed = 7372800
;monitor_filters = log2file ; This exports message information into the Directory\logs\device-monitor-{YYMMDD-HHMMSS}.log
;monitor_filters = hexlify  ; This sends message information to serial terminal in hexidecimal output
extra_scripts = pre:scripts/build_flags.py
